services:
  postgres:
    image: postgres:15
    container_name: goshop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: goshop
    ports:
      - "5435:5432"

  redis:
    image: redis:7
    container_name: goshop-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.3.1
    container_name: goshop-kafka
    ports:
      - "9092:9092"